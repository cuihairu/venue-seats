name: venue_seats
description: >-
  Interactive 2D venue seat maps for Flutter: zoom/pan, hover, sold-out states,
  price-tier colouring, section (区) then row (排) selection. Reads the same
  JSON documents as the @venue-seats web packages.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
