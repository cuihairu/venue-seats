name: venue_seats
description: >-
  Interactive 2D venue seat maps for Flutter: zoom/pan, hover, sold-out states,
  price-tier colouring, section and row selection, from the same JSON as the
  web packages.
version: 0.0.1
repository: https://github.com/cuihairu/venue-seats
homepage: https://cuihairu.github.io/venue-seats/

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
