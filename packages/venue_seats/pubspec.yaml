name: venue_seats
description: >-
  Interactive 2D venue seat maps for Flutter: zoom/pan, hover, sold-out states,
  price-tier colouring, section and row selection, from the same JSON as the
  web packages.
version: 0.0.1
repository: https://github.com/cuihairu/venue-seats
homepage: https://cuihairu.github.io/venue-seats/

environment:
  # floors track material_ui (Dart ^3.13.0, Flutter >=3.47.0); the old
  # >=3.4.0 / >=3.22.0 floor cannot resolve with the replacement package.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # official replacement for the deprecated package:flutter/material.dart
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
