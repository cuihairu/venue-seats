name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        # no `version`: read the `packageManager` field (pnpm@9.15.0)
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r test:coverage
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pnpm -r build
      - run: pnpm publish:check

  flutter:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/venue_seats
      # stable-3.50.x deprecates package:flutter/material.dart in favour of
      # package:material_ui/material_ui.dart (4 infos). They are framework
      # migration noise, not defects; keep errors/warnings fatal but do not
      # fail the build on them. Migrating the imports is a dependency decision
      # for the user (see docs/审计-文档一致性.md).
      - run: flutter analyze --no-fatal-infos
        working-directory: packages/venue_seats
      - run: flutter test
        working-directory: packages/venue_seats
