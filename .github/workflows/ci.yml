name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        # no `version`: read the `packageManager` field (pnpm@9.15.0)
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r test:coverage
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pnpm -r build
      - run: pnpm publish:check

  flutter:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - run: flutter pub get
        working-directory: packages/venue_seats
      # stable-3.50.x moved the material library to package:material_ui
      # (adopted here, commit 1f9e489). --no-fatal-infos keeps any future
      # framework deprecation infos from failing the build while
      # errors/warnings stay fatal.
      - run: flutter analyze --no-fatal-infos
        working-directory: packages/venue_seats
      - run: flutter test
        working-directory: packages/venue_seats
